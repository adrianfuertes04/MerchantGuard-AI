[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# =============================================================================
# MerchantGuard AI - Intelligent FinTech Churn Prediction & Retention Platform
# =============================================================================

[project]
name = "merchantguard-ai"
version = "1.0.0"
description = "End-to-End FinTech Merchant Intelligence, Churn Prediction & AI Retention Agent Platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Adrian Fuertes", email = "adrianfuerteslopez@gmail.com" },
]
keywords = ["fintech", "churn-prediction", "machine-learning", "agentic-ai", "fastapi", "agno", "xgboost", "lightgbm"]

# -----------------------------------------------------------------------------
# Core Dependencies
# -----------------------------------------------------------------------------
dependencies = [
    # Data & ML
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "lightgbm==4.5.0",
    "shap==0.46.0",

    # Notebooks & Visualization
    "jupyter==1.0.0",
    "ipykernel==6.29.5",
    "matplotlib>=3.9,<4",

    # API Stack
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",

    # Agentic Framework & LLM
    "agno>=2.5,<3",
    "openai>=1.40,<2",

    # Utilities
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
]
bonus = [
    "networkx==3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
managed = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "RUF"]
